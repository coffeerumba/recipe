<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4458">
  <title>レシぴったん</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left"></div>
      <h1>レシぴったん</h1>
      <div class="header-right">
        <button class="header-icon-btn" id="reset-history" title="履歴をリセット" aria-label="履歴をリセット">↺</button>
      </div>
    </header>

    <main class="app-main" id="main"></main>

    <nav class="app-nav">
      <button data-tab="swipe" class="active"><span class="nav-icon">🔍</span><span>スワイプ</span></button>
      <button data-tab="liked"><span class="nav-icon">💚</span><span id="liked-label">お気に入り</span></button>
      <button data-tab="materials"><span class="nav-icon">🛒</span><span>材料</span></button>
    </nav>
  </div>

  <div class="sheet-overlay hidden" id="sheet-overlay">
    <div class="sheet">
      <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
      <div class="sheet-header">
        <h2>フィルタ</h2>
        <button class="sheet-close" id="sheet-close" aria-label="閉じる">×</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="sheet-footer">
        <button class="reset-btn" id="filter-reset">リセット</button>
        <button class="apply-btn" id="filter-apply">適用</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="recipes-data.js"></script>
  <script src="categories.js"></script>
  <script src="app.js"></script>
</body>
</html>
